name: Supabase migration replay

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migration-replay.yml"
  push:
    branches:
      - "migration/supabase-target-preview"
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-from-empty-database:
    name: Replay all migrations on a local database
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Replay every migration from an empty database
        run: supabase db reset --local --no-seed

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
